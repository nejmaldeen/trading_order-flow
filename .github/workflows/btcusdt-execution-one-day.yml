name: BTCUSDT one-day audit smoke
on:
  push:
    branches: [research/executed-volume-integrity-smoke]
permissions:
  contents: read
jobs:
  one-day:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Official 2017 day: verify checksum and reconcile
        run: python3 scripts/audit-binance-official-reconciliation.py
      - name: Existing unit suite (independent check)
        if: always()
        run: node --test tests/*.test.mjs
      - name: Preserve official audit JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btcusdt-one-day-report
          path: audit-results/official-report.json
          if-no-files-found: warn
